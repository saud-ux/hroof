<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>حروف - عرض الأسئلة</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <h1>حروف</h1>
    <p class="subtitle">عرض الأسئلة مباشرة - بدون فرق</p>
  </header>

  <main class="container">
    <section class="controls">
      <label for="category">الفئة</label>
      <select id="category" aria-label="اختر الفئة"></select>
      <button id="toggleAll" class="btn secondary" type="button">إظهار كل الإجابات</button>
    </section>

    <section id="list" class="list" aria-live="polite"></section>

    <p id="status" class="status" role="status"></p>
  </main>

  <footer class="footer">
    <span>حروف &middot; اعرض الأسئلة بدون انضمام لفريق</span>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
