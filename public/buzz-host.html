<!doctype html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>بزّر — شاشة المقدم</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="presenter solo-host">
  <header class="topbar">
    <h1 class="app-title small">بزّر — شاشة المقدم</h1>
    <span class="muted" id="round-label">جولة ١</span>
  </header>

  <main class="solo-host-main">
    <section class="solo-share">
      <p class="muted">رابط المشاركين</p>
      <div class="solo-link-row">
        <code id="share-link">…</code>
        <button id="copy-link" class="btn btn-ghost btn-small">نسخ</button>
      </div>
      <img id="share-qr" class="solo-qr" alt="QR" src="/qr?path=/buzz" />
    </section>

    <section class="solo-stage">
      <div class="solo-qpick" id="qpick">
        <p class="muted letter-caption">الحرف الذي تبدأ به الإجابة</p>
        <div class="letter-strip" id="letter-strip">
          <button class="letter-btn active" data-letter="">أي حرف</button>
        </div>
        <div class="solo-diff-row" id="diff-row">
          <button class="btn diff-pill easy" data-diff="سهل">سهل <span class="diff-count" data-count="سهل"></span></button>
          <button class="btn diff-pill medium" data-diff="متوسط">متوسط <span class="diff-count" data-count="متوسط"></span></button>
          <button class="btn diff-pill hard" data-diff="صعب">صعب <span class="diff-count" data-count="صعب"></span></button>
        </div>
      </div>

      <div class="solo-question" id="question-box" hidden>
        <div class="solo-q-meta">
          <span>الفئة: <b id="q-category">—</b></span>
          <span>الصعوبة: <b id="q-difficulty">—</b></span>
        </div>
        <p class="solo-q-text" id="q-text">—</p>
        <p class="solo-q-answer">الإجابة: <b id="q-answer">—</b></p>
        <p class="solo-q-hint muted" id="q-hint"></p>
      </div>

      <div id="winner-box" class="solo-winner-box idle">
        <span id="winner-name">لم يبدأ البزّ</span>
        <span id="winner-ms" class="solo-ms"></span>
      </div>

      <div class="solo-controls">
        <button id="arm-btn" class="btn btn-primary btn-large">فتح البزّ</button>
        <button id="next-btn" class="btn btn-next" hidden>جولة جديدة</button>
        <button id="disarm-btn" class="btn btn-ghost">قفل</button>
        <button id="clear-q-btn" class="btn btn-ghost btn-small" hidden>إخفاء السؤال</button>
        <button id="clear-btn" class="btn btn-danger btn-small">تصفير الغرفة</button>
      </div>

      <ol id="press-order" class="solo-order"></ol>
    </section>

    <section class="solo-players">
      <div class="voice-panel">
        <button id="voice-btn" class="btn btn-ghost btn-small">🎙 تشغيل الصوت</button>
        <span id="voice-status" class="voice-status muted"></span>
        <button id="voice-all-btn" class="btn btn-small voice-all">🎙 افتح المايك للجميع</button>
        <label class="voice-mode">
          من يتكلم؟
          <select id="voice-mode" class="qb-select">
            <option value="winner">المقدم + الفائز</option>
            <option value="open">الجميع</option>
            <option value="host">المقدم فقط</option>
          </select>
        </label>
      </div>

      <div class="teams-setup">
        <div class="teams-head">
          <span class="muted">الفرق</span>
          <label class="teams-toggle">
            <input type="checkbox" id="teams-enabled" /> فريق ضد فريق
          </label>
        </div>
        <div id="teams-editor" hidden>
          <div id="teams-rows" class="teams-rows"></div>
          <div class="teams-actions">
            <button id="add-team" class="btn btn-ghost btn-small" type="button">+ فريق</button>
            <button id="save-teams" class="btn btn-primary btn-small" type="button">حفظ الفرق</button>
          </div>
          <p class="solo-error" id="teams-error" hidden></p>
        </div>
      </div>

      <p class="muted">المشاركون (<span id="players-count">0</span>)</p>
      <ul id="players-list" class="solo-player-list"></ul>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/voice.js"></script>
  <script src="/js/buzz-host.js"></script>
</body>
</html>
