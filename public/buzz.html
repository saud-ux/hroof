<!doctype html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>الزر</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/player.css" />
</head>
<body class="team solo">
  <!-- 1) Team picker (team mode only) -->
  <section id="team-view" class="solo-name" hidden>
    <h1 class="app-title small">الـــزر</h1>
    <p class="screen-lead">اختر فريقك</p>
    <p class="screen-sub">اضغط على بطاقة فريقك للمتابعة</p>
    <div class="team-cards" id="team-cards"></div>
  </section>

  <!-- 2) Name entry -->
  <section id="name-view" class="solo-name" hidden>
    <h1 class="app-title small">الـــزر</h1>
    <p class="screen-lead" id="name-heading">وش اسمك؟</p>
    <p class="screen-sub">حتى يعرف الجميع من ضغط أولاً</p>
    <p class="center solo-chosen-team" id="chosen-team" hidden></p>

    <form id="name-form" class="solo-form" autocomplete="off">
      <input id="name-input" class="solo-input" type="text" maxlength="24" placeholder="اسمك" required />

      <div class="solo-colors" id="color-row" hidden>
        <span class="screen-sub">اختر لونك</span>
        <div class="color-swatches" id="color-swatches"></div>
      </div>

      <button class="btn btn-primary btn-large" type="submit">دخول</button>
      <button class="btn btn-ghost btn-small" type="button" id="back-teams" hidden>رجوع لاختيار الفريق</button>
    </form>
    <p class="solo-error" id="name-error" hidden></p>
    <p class="muted center solo-count" id="lobby-count"></p>
  </section>

  <!-- 2) Buzzer -->
  <section id="buzz-view" class="buzzer-view" hidden>
    <header class="team-banner" id="me-banner"><span id="me-name">—</span></header>
    <div class="mini-scores" id="mini-scores" hidden></div>
    <main class="buzzer-main">
      <span id="timer-display" class="timer-display big" hidden>—</span>
      <button id="buzzer" class="buzzer" aria-label="الزر">
        <span id="buzzer-label">بانتظار الهوست</span>
      </button>
    </main>
    <footer class="solo-foot">
      <span id="winner-line" class="solo-winner-line"></span>
      <div class="voice-bar">
        <button id="voice-btn" class="btn btn-ghost btn-small">🎙 انضم للصوت</button>
        <span id="voice-status" class="voice-status muted"></span>
        <span class="mic-meter" id="mic-meter" hidden><i id="mic-level"></i></span>
      </div>
      <span id="players-line" class="muted"></span>
    </footer>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/voice.js"></script>
  <script src="/js/buzz.js"></script>
</body>
</html>
